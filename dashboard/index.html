<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1016">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Breakout Pool">
  <title>Breakout Pool</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .table-shell {
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
    }

    /* RS runtime must preserve the table's sticky header behavior. The visible
       info glyph stays compact while its touch target is large enough not to
       fall through to the RS sort control on mobile. */
    .review-table th[data-sort-field="rs_percentile"] {
      position: sticky !important;
      top: 0;
    }
    .review-table th[data-sort-field="rs_percentile"] > button:not(.rs-info-button) {
      padding-right: 38px !important;
    }
    .review-table .rs-info-button {
      width: 36px !important;
      height: 36px !important;
      right: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      font-size: 0 !important;
      cursor: pointer !important;
      -webkit-tap-highlight-color: transparent;
    }
    .review-table .rs-info-button::before {
      content: "i";
      box-sizing: border-box;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: #11171e;
      font: 800 10px/1 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="boot-card">
      <div class="boot-mark"></div>
      <div>
        <strong>Breakout Pool</strong>
        <span>Loading review snapshot…</span>
      </div>
    </section>
  </main>
  <noscript>This review dashboard requires JavaScript.</noscript>
  <script src="./app.js" defer></script>
  <script src="./rs_runtime.js" defer></script>
  <script src="./table_enhancements.js" defer></script>
</body>
</html>
