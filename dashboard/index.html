<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1016">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Breakout Pool">
  <title>Breakout Pool</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .table-shell {
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
    }

    .review-stage-status {
      display: grid;
      grid-template-columns: minmax(210px, .8fr) minmax(0, 3.2fr);
      gap: 10px;
      margin-top: 8px;
    }
    .review-flow-group { min-width: 0; }
    .review-flow-label {
      margin: 0 0 5px;
      color: #718094;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .review-flow-label span {
      color: #596779;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }
    .review-watch-grid.status-grid { grid-template-columns: minmax(0, 1fr); }
    .review-entry-grid.status-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .filter-helper {
      display: block;
      margin-top: 5px;
      color: #718094;
      font-size: 9px;
      line-height: 1.3;
    }
    @media (width > 1120px) {
      .status-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    @media (width > 760px) and (width <= 1120px) {
      .status-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (width <= 760px) {
      .review-stage-status { grid-template-columns: 1fr; }
      .review-entry-grid.status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* RS and Quality explanation controls are separate from their sort buttons.
       Shared sizing and spacing live in styles.css. */
    .rs-popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="boot-card">
      <div class="boot-mark"></div>
      <div>
        <strong>Breakout Pool</strong>
        <span>Loading review snapshot…</span>
      </div>
    </section>
  </main>
  <noscript>This review dashboard requires JavaScript.</noscript>
  <script src="./app.js" defer></script>
  <script src="./rs_runtime.js" defer></script>
  <script src="./table_enhancements.js" defer></script>
  <script src="./interaction_runtime.js" defer></script>
</body>
</html>
