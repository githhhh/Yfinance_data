name: Validate BF Calendar

on:
  push:
    branches:
      - ci/validate-bf-holiday-calendar

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          activate-environment: quant_env
          auto-activate-base: false
      - name: Install test dependencies
        run: python -m pip install -U pytest pandas numpy streamlit plotly yfinance tradingview-screener requests
      - name: Run repository tests and publish validation output
        run: |
          set +e
          python -m pytest tests dashboard/tests -q 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> pytest-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pytest-output.txt
          git commit -m "Record BF calendar validation output" || true
          git push --force origin HEAD:refs/heads/ci-results/yfinance-bf-calendar
          exit $status
