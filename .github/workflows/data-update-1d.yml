name: Update Stock Data - Daily (1D)

on:
  workflow_dispatch:

jobs:
  update-daily-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15  # Extended timeout for daily data

    steps:
      # --- MAIN EXECUTION ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create results directory
        run: mkdir -p results_pkl

      - name: Clean old data files
        run: |
          cd results_pkl 2>/dev/null || { echo "No results_pkl directory"; exit 0; }
          [ -f *.pkl ] 2>/dev/null || { echo "No pkl files found"; exit 0; }
          
          echo "Files (sorted by time, * = keep):"
          ls -t *.pkl | awk 'NR<=6 {print "  " $0 " *"} NR>6 {print "  " $0}'
          
          total=$(ls -1 *.pkl | wc -l)
          if [ "$total" -gt 6 ]; then
            ls -t *.pkl | tail -n +7 | xargs rm -f
            echo "Deleted $((total - 6)) old files, kept 6 newest"
          else
            echo "No cleanup needed ($total files)"
          fi

      - name: Install dependencies
        run: pip install yfinance==0.2.61

      - name: Run daily data download script
        run: |
          echo "Daily data execution started at: $(date +"%Y-%m-%d %H:%M:%S %Z")"
          python DataStore.py --period=2y --interval=1d
          echo "Daily data execution completed at: $(date +"%Y-%m-%d %H:%M:%S %Z")"

      - name: Commit and push daily data changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add results_pkl/*1d*.pkl
          git commit -m "Update daily stock data (2Y-1D) [skip ci]" || echo "No changes to commit"
          git push
