name: Deploy Review Dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - 'us/breakout_follow_pool.csv'
      - 'us/breakout_follow_pool_midweek.csv'
      - 'dashboard/**'
      - 'yfinance_data/**'
      - 'bf_snapshot.py'
      - '.github/workflows/deploy-review-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'us/breakout_follow_pool.csv'
      - 'us/breakout_follow_pool_midweek.csv'
      - 'dashboard/**'
      - 'yfinance_data/**'
      - 'bf_snapshot.py'
      - '.github/workflows/deploy-review-dashboard.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: review-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            dashboard/requirements-test.txt

      - name: Install dashboard test dependencies
        run: pip install -r dashboard/requirements-test.txt

      - name: Validate static sources
        run: |
          node --check dashboard/app.js
          node --check dashboard/table_enhancements.js
          python -m py_compile dashboard/build_static.py

      - name: Validate authoritative pool projection
        run: |
          python dashboard/self_check.py \
            --csv us/breakout_follow_pool.csv \
            --midweek-csv us/breakout_follow_pool_midweek.csv
          python -m pytest dashboard/tests -q

      - name: Build static dashboard
        run: python dashboard/build_static.py --output _site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
