name: Deploy Review Dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - 'us/breakout_follow_pool.csv'
      - 'us/breakout_follow_pool_midweek.csv'
      - 'dashboard/**'
      - 'yfinance_data/**'
      - 'bf_snapshot.py'
      - '.github/workflows/deploy-review-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'us/breakout_follow_pool.csv'
      - 'us/breakout_follow_pool_midweek.csv'
      - 'dashboard/**'
      - 'yfinance_data/**'
      - 'bf_snapshot.py'
      - '.github/workflows/deploy-review-dashboard.yml'
  # rs-log normally publishes the prior US market day's snapshot around
  # 01:30 UTC. Rebuild after that publication window so a Pool push that
  # arrived first can pick up the exact-date RS reference without creating
  # a second Pool/data schedule.
  schedule:
    - cron: '0 3 * * 4,6'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: review-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.static_build.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            dashboard/requirements-test.txt

      - name: Install dashboard test dependencies
        run: pip install -r dashboard/requirements-test.txt

      - name: Validate static sources
        run: |
          node --check dashboard/app.js
          node --check dashboard/table_enhancements.js
          python -m py_compile dashboard/build_static.py dashboard/rs_reference.py

      - name: Validate authoritative pool projection
        run: |
          python dashboard/self_check.py \
            --csv us/breakout_follow_pool.csv \
            --midweek-csv us/breakout_follow_pool_midweek.csv
          python -m pytest dashboard/tests -q

      - name: Build static dashboard
        id: static_build
        run: |
          python dashboard/build_static.py --output _site
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from dashboard.rs_reference import latest_completed_market_date

          payload = json.loads(Path("_site/data/dashboard.json").read_text(encoding="utf-8"))
          meta = payload.get("meta", {})
          rs = meta.get("rs_reference", {})
          expected = latest_completed_market_date(datetime.now(timezone.utc)).isoformat()
          period = payload.get("default_period")
          pool_date = (
              meta.get("midweek_snapshot_date")
              if period == "MIDWEEK"
              else meta.get("complete_snapshot_date")
          )
          publish = bool(rs.get("available")) and rs.get("market_date") == expected and pool_date == expected
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={'true' if publish else 'false'}\n")
          print(
              "Scheduled RS refresh:",
              f"expected_market_date={expected}",
              f"pool_date={pool_date}",
              f"rs_date={rs.get('market_date')}",
              f"publish={publish}",
          )
          PY

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && steps.static_build.outputs.publish == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.static_build.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
