name: Deploy Review Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'us/breakout_follow_pool.csv'
      - 'us/breakout_follow_pool_midweek.csv'
      - 'dashboard/**'
      - 'yfinance_data/**'
      - 'bf_snapshot.py'
      - '.github/workflows/deploy-review-dashboard.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: review-dashboard-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dashboard build dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Validate authoritative pool projection
        run: |
          python dashboard/self_check.py \
            --csv us/breakout_follow_pool.csv \
            --midweek-csv us/breakout_follow_pool_midweek.csv
          python -m pytest dashboard/tests -q

      - name: Build static dashboard
        run: python dashboard/build_static.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
