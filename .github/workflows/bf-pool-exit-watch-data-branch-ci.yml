name: BF Pool Exit Watch Data Branch Check
on:
  push:
    branches: ['feat/bf-pool-exit-watch-v1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.3.4 pandas==2.3.3 numpy==2.4.6
      - run: python -m compileall -q pool_exit_watch_store.py DataStore.py market_universe.py yfinance_data dashboard/build_static.py
      - run: python -m pytest -q tests/test_bf_pool_exit_watch_store.py dashboard/tests/test_pool_exit_watch_static.py
