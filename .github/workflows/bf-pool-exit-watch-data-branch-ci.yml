name: BF Pool Exit Watch Data Branch Check
on:
  push:
    branches: ['feat/bf-pool-exit-watch-v1', 'feat/bf-watch-download-hold-20261106']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r dashboard/requirements-test.txt
      - run: python -m compileall -q pool_exit_watch_store.py DataStore.py market_universe.py yfinance_data dashboard/build_static.py
      - run: python -m pytest -q tests/test_bf_pool_exit_watch_store.py tests/test_bf_pool_exit_watch_adversarial.py tests/test_watch_download_hold.py dashboard/tests/test_pool_exit_watch_static.py
      - name: Verify migrated official Watch is paired to branch HEAD
        run: |
          git update-ref refs/remotes/origin/main HEAD
          python - <<'PY'
          from pathlib import Path
          from pool_exit_watch_store import COLUMNS, parse_watch_csv, active_watch_codes
          from dashboard.build_static import build_watch_payload
          assert len(COLUMNS) == 24
          assert parse_watch_csv("us/bf_pool_exit_watch.csv")
          assert parse_watch_csv("us/bf_pool_exit_watch_midweek.csv")
          active_watch_codes(Path("."), required=True)
          assert build_watch_payload(Path("."))["available"] is True
          PY
      - run: python dashboard/build_static.py --output _site_watch_ci
      - run: test -s _site_watch_ci/pool-exit-watch.html && test -s _site_watch_ci/data/pool_exit_watch.json
