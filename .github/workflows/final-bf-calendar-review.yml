name: Final BF Calendar Review

on:
  push:
    branches:
      - ci/final-review-bf-calendar

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          activate-environment: quant_env
          auto-activate-base: false
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r dashboard/requirements.txt
          python -m pip install yfinance tradingview-screener requests
      - name: Run full repository tests and publish output
        run: |
          set +e
          python -m pytest tests dashboard/tests -q 2>&1 | tee pytest-output-final.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> pytest-output-final.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pytest-output-final.txt
          git commit -m "Record final BF calendar review output" || true
          git push --force origin HEAD:refs/heads/ci-results/final-yfinance-bf-calendar
          exit $status
