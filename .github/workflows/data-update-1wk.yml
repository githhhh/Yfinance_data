name: Update Stock Data - Weekly (1WK)

on:
  workflow_dispatch:
    inputs:
      exclude_tickers:
        description: 'Manual-only temporary excluded symbols (comma-separated, e.g. LXP)'
        required: false
        default: ''
        type: string

concurrency:
  group: bf-stock-data-main-writers
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-weekly-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Watch download preflight verifies latest COMPLETE Pool/Watch pairing
          # through Git history; checkout's default shallow depth=1 is invalid.
          # Partial clone avoids downloading every historical PKL blob.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Create results directory
        run: mkdir -p results_pkl

      - name: Install dependencies
        run: pip install yfinance==1.0 tradingview-screener==3.2.1

      - name: Run Screener and Merge
        continue-on-error: true
        run: |
          echo "Screener execution started at: $(date +"%Y-%m-%d %H:%M:%S %Z")"
          python DataStore.py --screener-only --min-eps-growth=150

      - name: Run weekly data download script
        env:
          EXCLUDE_TICKERS: ${{ github.event.inputs.exclude_tickers || '' }}
        run: |
          echo "Weekly data execution started at: $(date +"%Y-%m-%d %H:%M:%S %Z")"
          python DataStore.py --period=5y --interval=1wk --skip-screener --exclude-tickers="${EXCLUDE_TICKERS}"
          echo "Weekly data execution completed at: $(date +"%Y-%m-%d %H:%M:%S %Z")"

      - name: Clean old data files (Keep today only)
        run: |
          cd results_pkl 2>/dev/null || { echo "No results_pkl directory"; exit 0; }

          TODAY=$(date +"%d%m%y")
          echo "Keeping files with suffix: $TODAY"
          OLD_FILES=$(find . -name "*.pkl" ! -name "*${TODAY}*")

          if [ -z "$OLD_FILES" ]; then
            echo "No old files to clean."
          else
            echo "Deleting old files:"
            echo "$OLD_FILES"
            find . -name "*.pkl" ! -name "*${TODAY}*" -delete
            echo "Cleanup completed."
          fi

      - name: Commit and push weekly data changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          gh auth setup-git
          python scripts/publish_owned.py --message "Update weekly stock data (5Y-1WK) [skip ci]" -- results_pkl/ us/52wk_new_high_results.csv us/eps_growth_screener_results.csv us/weekly_vol_screener_results.csv us/stage2/stage2_screener_filter.csv us/stage2/stage2_whitelist.csv
