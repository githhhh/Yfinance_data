name: Final EPS PIT replay validation

on:
  push:
    branches:
      - fix/eps-pit-strict-replay

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pytest yfinance tradingview-screener
      - name: Compile EPS PIT
        run: python -m compileall -q eps_pit yfinance_data
      - name: Run EPS/PIT and publication contracts
        run: |
          python -m pytest \
            tests/test_eps_pit_store.py \
            tests/test_eps_sec_yahoo_provider.py \
            tests/test_eps_pit_composite.py \
            tests/test_eps_pit_resolver_contract.py \
            tests/test_signal_eps_lookup.py \
            dashboard/tests/test_eps_publication_contract.py \
            dashboard/tests/test_eps_publication_contract_extended.py \
            dashboard/tests/test_yfinance_data_contract.py \
            -q -k "not sec_endpoints_user_agent_smoke"
      - name: Replay critical-path smoke
        run: |
          python -m pytest -q \
            tests/test_eps_pit_resolver_contract.py::test_replay_never_trusts_prefilled_pool_eps \
            tests/test_eps_pit_resolver_contract.py::test_replay_reconciled_zero_base_persists_dual_source_evidence_and_projects_growth_type \
            tests/test_eps_pit_composite.py::test_replay_sec_numeric_does_not_query_yahoo_for_reconciliation \
            tests/test_eps_pit_composite.py::test_replay_sec_zero_base_is_reconciled_by_same_period_yahoo_event
