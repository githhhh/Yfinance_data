name: SEC smoke temp

on:
  push:
    branches:
      - fix/sec-edgar-access-contract

jobs:
  eps-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: pip install pytest yfinance==1.0 tradingview-screener
      - name: Run EPS contract tests
        run: |
          python -m pytest             tests/test_eps_sec_yahoo_provider.py             tests/test_eps_pit_composite.py             tests/test_eps_pit_resolver_contract.py             tests/test_signal_eps_lookup.py             -q
      - name: Report SEC live access with production identity
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import urllib.request
          import urllib.error

          source = pathlib.Path("eps_pit/providers/pit_provider.py").read_text()
          tree = ast.parse(source)
          user_agent = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "SEC_USER_AGENT" for t in node.targets)
          )
          urls = [
              "https://www.sec.gov/files/company_tickers.json",
              "https://data.sec.gov/api/xbrl/companyfacts/CIK0000008203.json",
              "https://data.sec.gov/api/xbrl/companyfacts/CIK0002100805.json",
          ]
          for url in urls:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": user_agent,
                      "Accept": "application/json",
                      "Accept-Encoding": "identity",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print(url, "HTTP", response.status)
              except urllib.error.HTTPError as exc:
                  print(url, "HTTP", exc.code)
          PY
