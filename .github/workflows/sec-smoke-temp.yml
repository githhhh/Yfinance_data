name: SEC smoke temp

on:
  push:
    branches:
      - fix/sec-edgar-access-contract

jobs:
  sec-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SEC endpoints with production User-Agent
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import urllib.request
          import urllib.error

          source = pathlib.Path("eps_pit/providers/pit_provider.py").read_text()
          tree = ast.parse(source)
          user_agent = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "SEC_USER_AGENT":
                          user_agent = ast.literal_eval(node.value)
                          break
              if user_agent:
                  break
          assert user_agent, "SEC_USER_AGENT constant not found"

          urls = [
              "https://www.sec.gov/files/company_tickers.json",
              "https://data.sec.gov/api/xbrl/companyfacts/CIK0000008203.json",
              "https://data.sec.gov/api/xbrl/companyfacts/CIK0002100805.json",
          ]
          for url in urls:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": user_agent,
                      "Accept-Encoding": "identity",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      prefix = response.read(64)
                      print(url, "HTTP", response.status, "prefix_bytes", len(prefix))
                      assert response.status == 200
              except urllib.error.HTTPError as exc:
                  print(url, "HTTP", exc.code)
                  raise
          PY
