name: SEC resume temp

on:
  push:
    branches:
      - fix/sec-bulk-resume-download

jobs:
  eps-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: pip install pytest yfinance==1.0 tradingview-screener
      - name: Run EPS contract tests
        run: |
          python -m pytest             tests/test_eps_sec_yahoo_provider.py             tests/test_eps_pit_composite.py             tests/test_eps_pit_resolver_contract.py             tests/test_signal_eps_lookup.py             -q
