name: SEC access smoke temp

on:
  push:
    branches:
      - fix/live-eps-terminal-semantics

jobs:
  sec-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe SEC endpoints with production identity
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import urllib.request
          import urllib.error

          source = pathlib.Path("eps_pit/providers/pit_provider.py").read_text()
          tree = ast.parse(source)
          user_agent = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "SEC_USER_AGENT" for t in node.targets)
          )

          urls = [
              "https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip",
              "https://www.sec.gov/files/company_tickers.json",
              "https://data.sec.gov/api/xbrl/companyfacts/CIK0000008203.json",
          ]
          for url in urls:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": user_agent,
                      "Accept": "*/*",
                      "Accept-Encoding": "identity",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print(url, "HTTP", response.status)
              except urllib.error.HTTPError as exc:
                  print(url, "HTTP", exc.code)
              except Exception as exc:
                  print(url, type(exc).__name__, repr(exc))
          PY
