name: Market Data Provider Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'DataStore.py'
      - 'data_providers/**'
      - 'tests/test_*provider*.py'
      - 'tests/test_market_data_integrity.py'
      - 'tests/test_yahoo_*.py'
      - '.github/workflows/market-data-provider-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: pip install pandas==2.3.3 requests==2.34.2 pytest==8.3.4 yfinance==1.0 tradingview-screener==3.2.1

      - name: Scan repository and history
        run: python security_scan.py --history

      - name: Compile download paths
        run: python -m py_compile DataStore.py data_providers/yahoo_provider.py data_providers/schwab_provider.py

      - name: Verify both providers and PKL publication boundaries
        run: |
          python -m pytest -q \
            tests/test_datastore_providers.py \
            tests/test_market_data_integrity.py \
            tests/test_yahoo_data_integrity_fail_fast.py \
            tests/test_yahoo_rate_limit.py \
            tests/test_yahoo_history_options.py \
            tests/test_schwab_provider_boundary.py \
            tests/test_live_provider_price_contract.py

      - name: Full repository data-pipeline regression suite
        run: python -m pytest tests -q
